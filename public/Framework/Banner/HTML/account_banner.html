<!-- =========================================================
BPD GAMING NETWORK
ACCOUNT BANNER

File:
    Framework/Banner/HTML/account_banner.html

Purpose:
    Persistent global account and authentication banner.

Description:
    - Displays the BPD Gaming Network brand.
    - Provides a mount point for global account status.
    - Provides a mount point for dynamic account actions.
    - Provider icons and authentication actions are rendered
      dynamically by account_banner.js.
    - Remains outside the route-rendered site header.
========================================================= -->

<div
    class="bpd-account-banner__inner"
    data-account-banner-state="loading"
>
    <div class="bpd-account-banner__brand">
        <span class="bpd-account-banner__network">
            BPD Gaming Network
        </span>
    </div>

    <div
        class="bpd-account-banner__status"
        id="accountBannerStatus"
        aria-live="polite"
    >
        <span
            class="bpd-account-banner__loading"
            id="accountBannerLoading"
        >
            Checking account...
        </span>
    </div>

    <div
        class="bpd-account-banner__actions"
        id="accountBannerActions"
    >
    </div>
</div>
