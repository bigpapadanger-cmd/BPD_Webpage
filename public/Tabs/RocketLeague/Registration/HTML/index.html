<section class="rl-registration" aria-labelledby="rlRegistrationTitle">
    <form
        id="rlRegistrationForm"
        class="rl-registration-form"
        novalidate
    >
        <header class="registration-intro">
            <span class="registration-eyebrow" data-copy="eyebrow"></span>

            <h1 id="rlRegistrationTitle" data-copy="title"></h1>

            <p data-copy="intro"></p>
        </header>

        <div
            id="registrationMessage"
            class="registration-message"
            role="status"
            aria-live="polite"
            hidden
        ></div>

        <div
            id="registrationBackendWarning"
            class="registration-warning"
            role="status"
            aria-live="polite"
            hidden
        >
            <strong data-copy="backendWarningTitle"></strong>
            <span data-copy="backendWarningBody"></span>
        </div>

        <fieldset class="form-section epic-section">
            <legend data-copy="epicLegend"></legend>

            <p class="section-description" data-copy="epicDescription"></p>

            <div class="field-grid two-columns">
                <label class="form-field">
                    <span>
                        <span data-copy="epicUserLabel"></span>
                        <span class="required-mark" aria-hidden="true">*</span>
                    </span>

                    <input
                        id="epicDisplayName"
                        name="epicDisplayName"
                        type="text"
                        readonly
                    >
                </label>

                <label class="form-field">
                    <span data-copy="platformLabel"></span>

                    <input
                        id="epicPlatform"
                        name="epicPlatform"
                        type="text"
                        readonly
                    >
                </label>

                <label class="form-field">
                    <span data-copy="locationLabel"></span>

                    <input
                        id="detectedLocation"
                        name="detectedLocation"
                        type="text"
                        readonly
                    >

                    <small data-copy="locationHelp"></small>
                </label>

                <label class="form-field">
                    <span data-copy="timezoneLabel"></span>

                    <input
                        id="timezoneDisplay"
                        type="text"
                        readonly
                    >

                    <input
                        id="timezone"
                        name="timezone"
                        type="hidden"
                    >
                </label>
            </div>
        </fieldset>

        <fieldset class="form-section eligibility-section">
            <legend data-copy="eligibilityLegend"></legend>

            <label class="confirmation-row">
                <input
                    id="ageConsent"
                    name="ageConsent"
                    type="checkbox"
                    required
                >

                <span>
                    <span data-copy="eligibilityText"></span>
                    <span class="required-mark" aria-hidden="true">*</span>
                </span>
            </label>
        </fieldset>

        <fieldset class="form-section">
            <legend data-copy="playerProfileLegend"></legend>

            <div class="field-grid two-columns">
                <label class="form-field">
                    <span>
                        <span data-copy="displayNameLabel"></span>
                        <span class="required-mark" aria-hidden="true">*</span>
                    </span>

                    <input
                        id="displayName"
                        name="displayName"
                        type="text"
                        maxlength="32"
                        autocomplete="nickname"
                        required
                    >

                    <small data-copy="displayNameHelp"></small>
                </label>

                <label class="form-field">
                    <span>
                        <span data-copy="rankLabel"></span>
                        <span class="required-mark" aria-hidden="true">*</span>
                    </span>

                    <select
                        id="currentRank"
                        name="currentRank"
                        required
                    >
                        <option value="" data-copy-option="rankPlaceholder"></option>
                        <option value="unranked">Unranked</option>
                        <option value="bronze-1">Bronze I</option>
                        <option value="bronze-2">Bronze II</option>
                        <option value="bronze-3">Bronze III</option>
                        <option value="silver-1">Silver I</option>
                        <option value="silver-2">Silver II</option>
                        <option value="silver-3">Silver III</option>
                        <option value="gold-1">Gold I</option>
                        <option value="gold-2">Gold II</option>
                        <option value="gold-3">Gold III</option>
                        <option value="platinum-1">Platinum I</option>
                        <option value="platinum-2">Platinum II</option>
                        <option value="platinum-3">Platinum III</option>
                        <option value="diamond-1">Diamond I</option>
                        <option value="diamond-2">Diamond II</option>
                        <option value="diamond-3">Diamond III</option>
                        <option value="champion-1">Champion I</option>
                        <option value="champion-2">Champion II</option>
                        <option value="champion-3">Champion III</option>
                        <option value="grand-champion-1">Grand Champion I</option>
                        <option value="grand-champion-2">Grand Champion II</option>
                        <option value="grand-champion-3">Grand Champion III</option>
                        <option value="supersonic-legend">Supersonic Legend</option>
                    </select>

                    <small data-copy="rankHelp"></small>
                </label>

                <div class="form-field toggle-field">
                    <span data-copy="onlineStatusLabel"></span>

                    <label
                        class="toggle-row"
                        for="showOnlineStatus"
                    >
                        <input
                            id="showOnlineStatus"
                            name="showOnlineStatus"
                            type="checkbox"
                        >

                        <span class="toggle-control" aria-hidden="true"></span>

                        <span data-copy="onlineStatusText"></span>
                    </label>

                    <small data-copy="onlineStatusHelp"></small>
                </div>
            </div>
        </fieldset>

        <fieldset class="form-section">
            <legend data-copy="contactLegend"></legend>

            <p class="section-description" data-copy="contactDescription"></p>

            <div class="field-grid two-columns">
                <label class="form-field">
                    <span>
                        <span data-copy="emailLabel"></span>
                        <span
                            id="emailRequiredMark"
                            class="required-mark"
                            aria-hidden="true"
                        >*</span>
                    </span>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        maxlength="254"
                        autocomplete="email"
                    >
                </label>

                <label class="form-field">
                    <span>
                        <span data-copy="phoneLabel"></span>
                        <span
                            id="phoneRequiredMark"
                            class="required-mark"
                            aria-hidden="true"
                            hidden
                        >*</span>
                    </span>

                    <input
                        id="phone"
                        name="phone"
                        type="tel"
                        maxlength="24"
                        autocomplete="tel"
                        inputmode="tel"
                    >
                </label>
            </div>

            <span class="field-label">
                <span data-copy="contactMethodLabel"></span>
                <span class="required-mark" aria-hidden="true">*</span>
            </span>

            <div
                class="choice-row contact-method-row"
                role="radiogroup"
                aria-label="Preferred contact method"
            >
                <label class="choice-card" data-choice-value="email">
                    <input
                        name="contactMethod"
                        type="radio"
                        value="email"
                        checked
                    >
                    <span data-copy="contactEmail"></span>
                </label>

                <label class="choice-card" data-choice-value="phone">
                    <input
                        name="contactMethod"
                        type="radio"
                        value="phone"
                    >
                    <span data-copy="contactPhone"></span>
                </label>

                <label class="choice-card" data-choice-value="both">
                    <input
                        name="contactMethod"
                        type="radio"
                        value="both"
                    >
                    <span data-copy="contactBoth"></span>
                </label>
            </div>
        </fieldset>

        <fieldset class="form-section">
            <legend data-copy="modeLegend"></legend>

            <span class="field-label inline-required">
                <span data-copy="modeLabel"></span>
                <span class="required-mark" aria-hidden="true">*</span>
            </span>

            <div
                class="choice-grid"
                role="radiogroup"
                aria-label="Preferred Rocket League mode"
            >
                <label class="choice-card">
                    <input name="preferredMode" type="radio" value="1s" required>
                    <span>1s</span>
                </label>

                <label class="choice-card">
                    <input name="preferredMode" type="radio" value="2s">
                    <span>2s</span>
                </label>

                <label class="choice-card">
                    <input name="preferredMode" type="radio" value="3s">
                    <span>3s</span>
                </label>

                <label class="choice-card">
                    <input name="preferredMode" type="radio" value="customs">
                    <span data-copy="modeCustoms"></span>
                </label>

                <label class="choice-card">
                    <input name="preferredMode" type="radio" value="other">
                    <span data-copy="modeOther"></span>
                </label>
            </div>

            <label
                id="otherModeField"
                class="form-field other-mode-field"
                hidden
            >
                <span>
                    <span data-copy="otherModeLabel"></span>
                    <span class="required-mark" aria-hidden="true">*</span>
                </span>

                <input
                    id="otherMode"
                    name="otherMode"
                    type="text"
                    maxlength="50"
                >
            </label>
        </fieldset>

        <fieldset class="form-section">
            <legend data-copy="availabilityLegend"></legend>

            <p class="section-description">
                <span data-copy="availabilityDescription"></span>
                <span class="required-mark" aria-hidden="true">*</span>
            </p>

            <div
                id="availabilityRows"
                class="availability-list"
            ></div>
        </fieldset>

        <fieldset class="form-section">
            <legend data-copy="notificationsLegend"></legend>

            <div class="notification-setting">
                <span class="field-label">
                    <span data-copy="notificationsLabel"></span>
                    <span class="required-mark" aria-hidden="true">*</span>
                </span>

                <div
                    class="choice-row notification-choice-row"
                    role="radiogroup"
                    aria-label="Match notifications"
                >
                    <label class="choice-card">
                        <input
                            name="notificationsEnabled"
                            type="radio"
                            value="true"
                            checked
                            required
                        >
                        <span data-copy="notificationsOn"></span>
                    </label>

                    <label class="choice-card warning-choice">
                        <input
                            name="notificationsEnabled"
                            type="radio"
                            value="false"
                        >
                        <span data-copy="notificationsOff"></span>
                    </label>
                </div>
            </div>

            <div
                id="notificationOptOutWarning"
                class="inline-warning"
                role="alert"
                hidden
            >
                <strong data-copy="notificationOptOutTitle"></strong>
                <span data-copy="notificationOptOutBody"></span>
            </div>

            <div
                id="reminderOptions"
                class="reminder-options"
            >
                <span class="field-label">
                    <span data-copy="reminderModeLabel"></span>
                    <span class="required-mark" aria-hidden="true">*</span>
                </span>

                <div
                    class="choice-row reminder-mode-row"
                    role="radiogroup"
                    aria-label="Reminder timing"
                >
                    <label class="choice-card">
                        <input
                            name="reminderMode"
                            type="radio"
                            value="24-hours"
                            checked
                            required
                        >
                        <span data-copy="reminder24"></span>
                    </label>

                    <label class="choice-card">
                        <input
                            name="reminderMode"
                            type="radio"
                            value="1-hour"
                        >
                        <span data-copy="reminder1"></span>
                    </label>

                    <label class="choice-card">
                        <input
                            name="reminderMode"
                            type="radio"
                            value="both"
                        >
                        <span data-copy="reminderBoth"></span>
                    </label>

                    <label class="choice-card">
                        <input
                            name="reminderMode"
                            type="radio"
                            value="specific-times"
                        >
                        <span data-copy="reminderSpecific"></span>
                    </label>
                </div>

                <div
                    id="specificReminderTimes"
                    class="specific-reminder-times"
                    hidden
                >
                    <div class="reminder-window-heading">
                        <strong data-copy="specificTimesTitle"></strong>
                        <span data-copy="specificTimesBody"></span>
                    </div>

                    <div
                        id="reminderTimeSlots"
                        class="reminder-slot-grid reminder-slot-grid-24h"
                    ></div>
                </div>

                <div class="reminder-note">
                    <strong data-copy="reminderNoteTitle"></strong>
                    <span data-copy="reminderNoteBody"></span>
                </div>
            </div>
        </fieldset>

        <aside class="post-registration-note">
            <strong data-copy="moreSettingsTitle"></strong>
            <span data-copy="moreSettingsBody"></span>
        </aside>

        <div class="form-actions">
            <button
                id="registrationSubmit"
                class="primary-button"
                type="submit"
                data-copy="submitButton"
            ></button>

            <p data-copy="requiredFooter"></p>
        </div>
    </form>

    <div
        id="notificationOptOutModal"
        class="registration-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="notificationOptOutModalTitle"
        hidden
    >
        <div class="registration-modal-backdrop" data-modal-close></div>

        <div class="registration-modal-card">
            <strong
                id="notificationOptOutModalTitle"
                data-copy="notificationModalTitle"
            ></strong>

            <p data-copy="notificationModalBody"></p>

            <div class="registration-modal-actions">
                <button
                    id="keepNotificationsButton"
                    class="secondary-button"
                    type="button"
                    data-copy="keepNotificationsButton"
                ></button>

                <button
                    id="confirmNotificationsOffButton"
                    class="danger-button"
                    type="button"
                    data-copy="confirmNotificationsOffButton"
                ></button>
            </div>
        </div>
    </div>
</section>
