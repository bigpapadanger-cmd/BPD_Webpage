<!--
=========================================================
BPD GAMING NETWORK
ROCKET LEAGUE SIDEBAR
=========================================================
-->

<div class="sidebar-view sidebar-view-rocketleague">
    <!-- Toggle box -->
    <div class="sidebar-toggle-box">
        <button
            class="sidebar-toggle"
            id="sidebarToggle"
            type="button"
            aria-label="Toggle navigation"
            aria-expanded="true"
        >
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
        </button>
    </div>

    <!-- Navigation body -->
    <nav
        class="sidebar-navigation sidebar-nav"
        aria-label="Rocket League navigation"
    >
        <!-- Account: guest -->
        <div
            class="sidebar-group"
            data-auth="guest"
        >
                <a
                    href="/Dashboard"
                    class="nav-item"
                    data-router-link
                    data-nav-route="/Dashboard"
                    data-tooltip="Dashboard"
                >
                    <span
                        class="nav-icon"
                        aria-hidden="true"
                    >
                        ⌂
                    </span>

                    <span class="nav-text">
                        <span class="nav-label">
                            Dashboard
                        </span>
                    </span>
                </a>        
            <button
                class="nav-item sidebar-auth-button"
                id="sidebarLoginButton"
                type="button"
                data-api-action="epic-login"
                data-tooltip="Login for Full Access"
                aria-label="Login or Register"
            >
                <span
                    class="nav-icon"
                    aria-hidden="true"
                >
                    ⇥
                </span>

                <span class="nav-text">
                    <span class="nav-label">
                        Login / Register
                    </span>
                </span>
            </button>
        </div>

        <!-- Account: authenticated -->
        <div
            class="sidebar-group"
            data-auth="authenticated"
            hidden
        >
            <button
                class="nav-item sidebar-auth-button"
                id="sidebarLogoutButton"
                type="button"
                data-api-action="logout"
                data-tooltip="Logout"
                aria-label="Logout"
            >
                <span
                    class="nav-icon"
                    aria-hidden="true"
                >
                    ⇤
                </span>

                <span class="nav-text">
                    <span class="nav-label">
                        Logout
                    </span>
                </span>
            </button>
        </div>

        <!-- Protected navigation -->
        <div
            class="sidebar-authenticated"
            id="sidebarAuthenticated"
            data-auth="authenticated"
            hidden
        >
            <!-- Network -->
            <div
                class="nav-divider"
                role="separator"
            ></div>

            <div class="sidebar-group">
                <span class="sidebar-group-label">
                    Network
                </span>

                <a
                    href="/"
                    class="nav-item"
                    data-router-link
                    data-nav-route="/"
                    data-tooltip="Main Menu"
                >
                    <span
                        class="nav-icon"
                        aria-hidden="true"
                    >
                        ←
                    </span>

                    <span class="nav-text">
                        <span class="nav-label">
                            Main Menu
                        </span>
                    </span>
                </a>

                <a
                    href="/RocketLeague"
                    class="nav-item"
                    data-router-link
                    data-nav-route="/RocketLeague"
                    data-tooltip="Overview"
                >
                    <span
                        class="nav-icon"
                        aria-hidden="true"
                    >
                        ⌂
                    </span>

                    <span class="nav-text">
                        <span class="nav-label">
                            Overview
                        </span>
                    </span>
                </a>
            </div>

            <!-- Competition -->
            <div
                class="nav-divider"
                role="separator"
            ></div>

            <div
                class="sidebar-group sidebar-menu"
                data-sidebar-menu
            >
                <span class="sidebar-group-label">
                    Competition
                </span>

                <button
                    class="nav-item sidebar-menu-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-controls="competitionSubmenu"
                    data-tooltip="Competition"
                >
                    <span
                        class="nav-icon"
                        aria-hidden="true"
                    >
                        ⚔
                    </span>

                    <span class="nav-text">
                        <span class="nav-label">
                            Matches
                        </span>
                    </span>

                    <span
                        class="submenu-arrow"
                        aria-hidden="true"
                    >
                        ›
                    </span>
                </button>

                <div
                    class="sidebar-submenu"
                    id="competitionSubmenu"
                    hidden
                >
                    <a
                        href="/RocketLeague/WeeklyMatches"
                        class="submenu-item"
                        data-router-link
                        data-nav-route="/RocketLeague/WeeklyMatches"
                    >
                        Join Weekly Matches
                    </a>

                    <a
                        href="/RocketLeague/MyMatches"
                        class="submenu-item"
                        data-router-link
                        data-nav-route="/RocketLeague/MyMatches"
                    >
                        My Matches
                    </a>

                    <a
                        href="/RocketLeague/MatchResults"
                        class="submenu-item"
                        data-router-link
                        data-nav-route="/RocketLeague/MatchResults"
                    >
                        Match Results
                    </a>

                    <a
                        href="/RocketLeague/PrivateMatches"
                        class="submenu-item"
                        data-router-link
                        data-nav-route="/RocketLeague/PrivateMatches"
                    >
                        Private Matches
                    </a>
                </div>
            </div>

            <!-- Players -->
            <div
                class="nav-divider"
                role="separator"
            ></div>

            <div
                class="sidebar-group sidebar-menu"
                data-sidebar-menu
            >
                <span class="sidebar-group-label">
                    Players
                </span>

                <button
                    class="nav-item sidebar-menu-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-controls="playersSubmenu"
                    data-tooltip="Players"
                >
                    <span
                        class="nav-icon"
                        aria-hidden="true"
                    >
                        ♙
                    </span>

                    <span class="nav-text">
                        <span class="nav-label">
                            Players
                        </span>
                    </span>

                    <span
                        class="submenu-arrow"
                        aria-hidden="true"
                    >
                        ›
                    </span>
                </button>

                <div
                    class="sidebar-submenu"
                    id="playersSubmenu"
                    hidden
                >
                    <a
                        href="/RocketLeague/FindPlayers"
                        class="submenu-item"
                        data-router-link
                        data-nav-route="/RocketLeague/FindPlayers"
                    >
                        Find Players
                    </a>

                    <a
                        href="/RocketLeague/Profile"
                        class="submenu-item"
                        data-router-link
                        data-nav-route="/RocketLeague/Profile"
                    >
                        My Profile
                    </a>
                </div>
            </div>

            <!-- Tools -->
            <div
                class="nav-divider"
                role="separator"
            ></div>

            <div
                class="sidebar-group sidebar-menu"
                data-sidebar-menu
            >
                <span class="sidebar-group-label">
                    Tools
                </span>

                <button
                    class="nav-item sidebar-menu-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-controls="toolsSubmenu"
                    data-tooltip="Tools"
                >
                    <span
                        class="nav-icon"
                        aria-hidden="true"
                    >
                        ▦
                    </span>

                    <span class="nav-text">
                        <span class="nav-label">
                            Tools
                        </span>
                    </span>

                    <span
                        class="submenu-arrow"
                        aria-hidden="true"
                    >
                        ›
                    </span>
                </button>

                <div
                    class="sidebar-submenu"
                    id="toolsSubmenu"
                    hidden
                >
                    <a
                        href="/RocketLeague/SubmitMatchScore"
                        class="submenu-item"
                        data-router-link
                        data-nav-route="/RocketLeague/SubmitMatchScore"
                    >
                        Submit Scoreboard
                    </a>
                </div>
            </div>
        </div>

        <!-- Push Settings to bottom -->
        <div
            class="sidebar-navigation-spacer"
            aria-hidden="true"
        ></div>

        <div
            class="nav-divider sidebar-bottom-divider"
            role="separator"
        ></div>

        <!-- Settings remains public -->
        <div class="sidebar-group sidebar-bottom">
            <a
                href="/Settings"
                class="nav-item"
                data-router-link
                data-nav-route="/Settings"
                data-tooltip="Settings"
            >
                <span
                    class="nav-icon"
                    aria-hidden="true"
                >
                    ⚙
                </span>

                <span class="nav-text">
                    <span class="nav-label">
                        Settings
                    </span>
                </span>
            </a>
        </div>
    </nav>
</div>
