<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Rocket League Players | BPD Gaming Network</title>
    <link rel="stylesheet" href="../CSS/index.css">
</head>
<body class="rocket-league-page find-players-page">
    <main class="rl-discovery-shell">
        <header class="rl-discovery-heading">
            <p class="rl-eyebrow">ROCKET LEAGUE COMMUNITY</p>
            <h1>Find Players</h1>
            <p>Search players who have chosen to make their profiles discoverable.</p>
        </header>

        <section class="rl-discovery-panel" aria-labelledby="playerSearchTitle">
            <h2 id="playerSearchTitle">Search the player directory</h2>
            <form id="playerSearchForm" class="player-search-form" role="search">
                <label for="playerSearchQuery">Player name</label>
                <div class="player-search-controls">
                    <input
                        id="playerSearchQuery"
                        name="q"
                        type="search"
                        minlength="2"
                        maxlength="80"
                        autocomplete="off"
                        placeholder="Enter at least 2 characters"
                        required
                    >
                    <button id="playerSearchSubmit" type="submit">Search players</button>
                </div>
                <p class="rl-search-note">Only opted-in profiles appear. Historical names may help matching but are never shown.</p>
            </form>
        </section>

        <p id="playerSearchStatus" class="rl-discovery-status" role="status" aria-live="polite">
            Enter a player name to begin.
        </p>
        <section id="playerSearchResults" class="rl-player-results" aria-label="Player search results"></section>
    </main>
</body>
</html>
