<section
    class="ark-panel"
    id="arkModsPanel"
    data-ark-panel="mods"
>

    <div class="ark-section-heading">

        <span class="ark-section-eyebrow">
            ARK MODS
        </span>

        <h2 class="ark-section-title">
            BPD ARK Mods
        </h2>

        <p class="ark-section-description">
            Browse active ARK mods created and maintained by
            BPD Gaming Network.
        </p>

    </div>


    <section class="ark-content-section">

        <div class="ark-content-heading">

            <div>

                <span class="ark-content-eyebrow">
                    ACTIVE PROJECTS
                </span>

                <h3>
                    Mods
                </h3>

            </div>

        </div>


        <div
            class="ark-mod-list"
            id="arkModList"
        >

            <a
                class="ark-mod-card"
                id="papaDangerAdminCard"
                href="https://www.curseforge.com/ark-survival-ascended/mods/papa-dangers-admin-advancements"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="ark-mod-media">

                    <img
                        class="ark-mod-image"
                        id="papaDangerAdminImage"
                        src="https://83374.media.forgecdn.net/avatars/thumbnails/955/82/256/256/638446872860408196.png"
                        alt="Papa Danger's Admin Advancements"
                        loading="lazy"
                    >

                    <div class="ark-mod-overlay">

                        <div class="ark-mod-overlay-content">

                            <span class="ark-mod-status">
                                Active
                            </span>

                            <h4
                                class="ark-mod-title"
                                id="papaDangerAdminTitle"
                            >
                                Papa Danger's Admin Advancements
                            </h4>

                        </div>

                        <span
                            class="ark-mod-external"
                            aria-hidden="true"
                        >
                            ↗
                        </span>

                    </div>

                </div>


                <div class="ark-mod-content">

                    <p
                        class="ark-mod-description"
                        id="papaDangerAdminDescription"
                    >
                        This mod enables players to gain more control
                        over their servers.
                    </p>


                    <div class="ark-mod-meta">

                        <span
                            id="papaDangerAdminVersion"
                        >
                            Version: 5.5-
                        </span>

                        <span
                            id="papaDangerAdminUpdated"
                        >
                            Updated: May 12, 2026
                        </span>

                        <span
                            id="papaDangerAdminDownloads"
                        >
                            Downloads: 9,981
                        </span>

                    </div>

                </div>

            </a>

        </div>

    </section>

</section>
