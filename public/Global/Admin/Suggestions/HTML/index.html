<section class="admin-suggestions" aria-labelledby="suggestionReviewTitle">
    <header>
        <p class="admin-eyebrow">COMMUNITY MODERATION</p>
        <h1 id="suggestionReviewTitle">Suggestion Review</h1>
        <p>Approve suggestions before they appear publicly, or reject items that should not be published.</p>
    </header>
    <p id="suggestionReviewStatus" role="status" aria-live="polite">Checking your permission…</p>
    <button id="suggestionReviewRefresh" type="button" hidden>Refresh pending suggestions</button>
    <details id="suggestionReviewSection" data-admin-accordion hidden>
        <summary><span>Review Suggestions</span><span id="suggestionReviewCount" class="admin-accordion-meta">Pending list unavailable</span></summary>
        <section id="suggestionReviewList" class="admin-suggestion-list admin-accordion-body" hidden aria-label="Pending suggestions"></section>
    </details>
</section>
