<!-- =========================================================
BPD GAMING NETWORK
TASKBOARD CONFIRMATION OVERLAY

File:
    public/Global/Admin/TaskBoard/HTML/task_confirm.html

Purpose:
    Provides a reusable confirmation/reason overlay for
    Taskboard actions.

Primary Uses:
    - Shelve Task
    - Archive Task
    - Delete Task
    - Other lifecycle confirmations as needed

Responsibilities:
    - Display a confirmation title and explanatory message.
    - Optionally display a required reason field.
    - Provide confirm, cancel, and close controls.
    - Display validation messages.

Shared Styling:
    public/Global/Admin/TaskBoard/CSS/overlays.css

Important:
    - This file is loaded dynamically by task_confirm.js.
    - This file must not load CSS or JavaScript directly.
    - Server-side authorization remains authoritative.
========================================================= -->

<section
    id="taskConfirmOverlay"
    class="task-overlay task-confirm-overlay"
    hidden
>
    <div
        id="taskConfirmDialog"
        class="task-dialog task-confirm-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="taskConfirmTitle"
        aria-describedby="taskConfirmDescription"
    >
        <!-- =================================================
        HEADER
        ================================================== -->

        <header class="task-dialog-header">
            <div class="task-dialog-header-content">
                <p
                    id="taskConfirmEyebrow"
                    class="task-dialog-eyebrow"
                >
                    Task Action
                </p>

                <h2 id="taskConfirmTitle">
                    Confirm Action
                </h2>

                <p id="taskConfirmDescription">
                    Are you sure you want to continue?
                </p>
            </div>

            <button
                id="taskConfirmClose"
                class="task-dialog-close"
                type="button"
                aria-label="Close Confirmation"
            >
                Close
            </button>
        </header>

        <!-- =================================================
        BODY
        ================================================== -->

        <div class="task-dialog-body">
            <form
                id="taskConfirmForm"
                class="task-dialog-form"
            >
                <!-- =========================================
                OPTIONAL REASON
                ========================================== -->

                <div
                    id="taskConfirmReasonSection"
                    class="task-dialog-field"
                    hidden
                >
                    <label
                        id="taskConfirmReasonLabel"
                        for="taskConfirmReason"
                    >
                        Reason
                    </label>

                    <textarea
                        id="taskConfirmReason"
                        name="reason"
                        rows="5"
                        maxlength="10000"
                        placeholder="Provide a reason..."
                    ></textarea>

                    <small>
                        This reason will be included with the
                        recorded task action when supported by
                        the lifecycle operation.
                    </small>
                </div>

                <!-- =========================================
                VALIDATION
                ========================================== -->

                <div
                    id="taskConfirmMessage"
                    class="task-dialog-message"
                    aria-live="polite"
                    hidden
                ></div>

                <!-- =========================================
                ACTIONS
                ========================================== -->

                <div class="task-dialog-actions">
                    <button
                        id="taskConfirmCancel"
                        type="button"
                    >
                        Cancel
                    </button>

                    <button
                        id="taskConfirmSubmit"
                        class="task-dialog-primary"
                        type="submit"
                    >
                        Confirm
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
