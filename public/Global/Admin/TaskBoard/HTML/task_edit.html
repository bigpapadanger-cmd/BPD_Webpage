<!-- =========================================================
BPD GAMING NETWORK
TASKBOARD EDIT TASK OVERLAY

File:
    public/Global/Admin/TaskBoard/HTML/task_edit.html

Purpose:
    Provides the modular Edit Task overlay used by the
    Admin Taskboard.

Responsibilities:
    - Display the current task code.
    - Allow editing title and description.
    - Allow editing priority and timeline.
    - Allow editing responsible administrative roles.
    - Display task update status messages.
    - Provide save, cancel, and close controls.

Shared Styling:
    public/Global/Admin/TaskBoard/CSS/overlays.css

Important:
    - This file is loaded dynamically by task_edit.js.
    - This file must not load CSS or JavaScript directly.
    - Server-side authorization and validation remain
      authoritative.
========================================================= -->

<section
    id="taskEditOverlay"
    class="task-overlay task-edit-overlay"
    hidden
>
    <div
        id="taskEditDialog"
        class="task-dialog task-edit-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="taskEditTitle"
        aria-describedby="taskEditDescription"
    >
        <!-- =================================================
        HEADER
        ================================================== -->

        <header class="task-dialog-header">
            <div class="task-dialog-header-content">
                <p
                    id="taskEditCode"
                    class="task-dialog-eyebrow"
                >
                    Task
                </p>

                <h2 id="taskEditTitle">
                    Edit Task
                </h2>

                <p id="taskEditDescription">
                    Update task details, priority, timeline,
                    and responsibility.
                </p>
            </div>

            <button
                id="taskEditClose"
                class="task-dialog-close"
                type="button"
                aria-label="Close Edit Task"
            >
                Close
            </button>
        </header>

        <!-- =================================================
        BODY
        ================================================== -->

        <div class="task-dialog-body">
            <form
                id="taskEditForm"
                class="task-dialog-form"
            >
                <!-- =========================================
                TITLE
                ========================================== -->

                <div class="task-dialog-field">
                    <label for="taskEditName">
                        Task Title
                    </label>

                    <input
                        id="taskEditName"
                        name="title"
                        type="text"
                        maxlength="160"
                        autocomplete="off"
                        placeholder="Enter task title"
                        required
                    >

                    <small>
                        Maximum 160 characters.
                    </small>
                </div>

                <!-- =========================================
                DESCRIPTION
                ========================================== -->

                <div class="task-dialog-field">
                    <label for="taskEditBody">
                        Description
                    </label>

                    <textarea
                        id="taskEditBody"
                        name="body"
                        rows="8"
                        maxlength="10000"
                        placeholder="Describe the work that needs to be completed..."
                        required
                    ></textarea>

                    <small>
                        Maximum 10,000 characters.
                    </small>
                </div>

                <!-- =========================================
                PRIORITY / TIMELINE
                ========================================== -->

                <div class="task-dialog-form-row">
                    <div class="task-dialog-field">
                        <label for="taskEditPriority">
                            Priority
                        </label>

                        <select
                            id="taskEditPriority"
                            name="priority"
                            required
                        >
                            <option
                                value=""
                                disabled
                            >
                                Select priority
                            </option>

                            <option value="Low">
                                Low
                            </option>

                            <option value="Medium">
                                Medium
                            </option>

                            <option value="High">
                                High
                            </option>

                            <option value="Critical">
                                Critical
                            </option>
                        </select>
                    </div>

                    <div class="task-dialog-field">
                        <label for="taskEditTimeline">
                            Timeline
                        </label>

                        <select
                            id="taskEditTimeline"
                            name="timeline_days"
                            required
                            disabled
                        >
                            <option value="">
                                Select priority first
                            </option>
                        </select>

                        <small id="taskEditTimelineHelp">
                            Timeline options depend on task
                            priority.
                        </small>
                    </div>
                </div>

                <!-- =========================================
                RESPONSIBILITY
                ========================================== -->

                <fieldset class="task-dialog-fieldset">
                    <legend>
                        Responsible Roles
                    </legend>

                    <p>
                        Select every administrative
                        responsibility role assigned to this
                        task.
                    </p>

                    <div class="task-dialog-role-options">
                        <label>
                            <input
                                type="checkbox"
                                name="responsible_roles"
                                value="owner"
                            >

                            <span>
                                Owner
                            </span>
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="responsible_roles"
                                value="database"
                            >

                            <span>
                                Database
                            </span>
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="responsible_roles"
                                value="security"
                            >

                            <span>
                                Security
                            </span>
                        </label>

                        <label>
                            <input
                                type="checkbox"
                                name="responsible_roles"
                                value="ui"
                            >

                            <span>
                                UI
                            </span>
                        </label>
                    </div>
                </fieldset>

                <!-- =========================================
                STATUS MESSAGE
                ========================================== -->

                <div
                    id="taskEditMessage"
                    class="task-dialog-message"
                    aria-live="polite"
                    hidden
                ></div>

                <!-- =========================================
                ACTIONS
                ========================================== -->

                <div class="task-dialog-actions">
                    <button
                        id="taskEditCancel"
                        type="button"
                    >
                        Cancel
                    </button>

                    <button
                        id="taskEditSubmit"
                        class="task-dialog-primary"
                        type="submit"
                    >
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
