<section class="error-page">

    <div
        class="error-background"
        aria-hidden="true">
    </div>

    <div class="error-container">

        <div class="error-logo">
            BPD Gaming Network
        </div>

        <div class="error-code">
            404
        </div>

        <h1 class="error-title">
            Looks like you missed the match.
        </h1>

        <p class="error-message">

            The page you're looking for doesn't exist,
            has moved, or isn't available yet.

        </p>

        <div class="error-button-group">

            <button
                id="errorGoBack"
                class="button"
                type="button">

                Go Back

            </button>

            <a
                class="button button-secondary"
                href="/"
                data-router-link>

                Main Menu

            </a>

        </div>

        <div class="error-status">

            <span
                class="status-dot"
                aria-hidden="true">
            </span>

            Network Online

        </div>

        <div class="error-brand">
            BPD GAMING NETWORK
        </div>

    </div>

</section>
