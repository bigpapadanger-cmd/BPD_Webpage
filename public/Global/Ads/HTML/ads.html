
<!--
=========================================================
GLOBAL ADVERTISEMENT COMPONENT
=========================================================
This is the shared advertisement template.

Pages should normally use an ad-slot container with a
data-ad-location attribute instead of directly writing
advertisement markup.

Example:

<div
    class="ad-slot ad-slot-top"
    data-ad-location="home-top">
</div>

The global ads.js file handles the contents.
=========================================================
-->

<div class="ad-container" data-ad-container>
    <!--
    The actual advertisement is inserted here by ads.js.

    Keeping this empty by default means the page HTML only
    describes where an advertisement belongs, not how the
    advertisement itself works.
    -->

    <div class="ad-label">ADVERTISEMENT</div>

    <div class="ad-content" data-ad-content>
        <!-- AdSense/content inserted here -->
    </div>
</div>
